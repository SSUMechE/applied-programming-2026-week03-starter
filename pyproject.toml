[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-week03-planning"
version = "0.1.0"
description = "Week 3 object-oriented planning-domain exercise"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ap_week03_planning*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

